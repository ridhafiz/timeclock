<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Time Clock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js" type="module"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-4xl w-full">
        <!-- Main title and user status -->
        <h1 class="text-4xl font-bold text-gray-800 text-center mb-2">Workplace Time Clock</h1>
        <p class="text-gray-500 text-center mb-6">Clock in and out with location verification.</p>

        <!-- User Information & Status -->
        <div class="mb-6 bg-blue-50 p-4 rounded-xl text-center">
            <p id="auth-status" class="text-gray-600 font-semibold mb-2">Authenticating...</p>
            <p id="user-id-display" class="text-sm text-gray-400 break-all"></p>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-4 mb-6">
            <button id="clock-in-btn" class="flex-1 bg-green-500 text-white font-bold py-4 px-6 rounded-xl hover:bg-green-600 transition-colors shadow-lg shadow-green-200" disabled>
                Clock In
            </button>
            <button id="clock-out-btn" class="flex-1 bg-red-500 text-white font-bold py-4 px-6 rounded-xl hover:bg-red-600 transition-colors shadow-lg shadow-red-200" disabled>
                Clock Out
            </button>
        </div>

        <!-- Status Message -->
        <div id="status-message" class="text-center text-sm font-semibold text-gray-600 min-h-[1.5rem] mb-6"></div>

        <!-- Time Sheet Table -->
        <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">Employee Timesheet</h2>
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white rounded-xl shadow-md border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-left text-gray-600 uppercase text-sm leading-normal">
                        <th class="py-3 px-6 border-b">Employee ID</th>
                        <th class="py-3 px-6 border-b">Clock In</th>
                        <th class="py-3 px-6 border-b">Clock Out</th>
                        <th class="py-3 px-6 border-b">Status</th>
                    </tr>
                </thead>
                <tbody id="timesheet-body" class="text-gray-700 text-sm font-light">
                    <!-- Data will be populated here by JavaScript -->
                    <tr id="loading-row">
                        <td colspan="4" class="py-4 text-center text-gray-500">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Custom Modal for Alerts -->
    <div id="modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center hidden">
        <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm text-center">
            <h3 id="modal-title" class="text-lg font-bold mb-2"></h3>
            <p id="modal-message" class="text-gray-600 mb-4"></p>
            <button id="modal-close" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, addDoc, setDoc, updateDoc, onSnapshot, collection, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global variables provided by the Canvas environment
        
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
	const firebaseConfig = {
	  apiKey: "AIzaSyC0MNUfNkaiErI6TbLb39KmHcdLyMfmow4",
	  authDomain: "time-clock-e88ed.firebaseapp.com",
	  projectId: "time-clock-e88ed",
	  storageBucket: "time-clock-e88ed.firebasestorage.app",
	  messagingSenderId: "624022715043",
	  appId: "1:624022715043:web:828c6fc9ec492b2cd41d16",
	  measurementId: "G-B7H4VN10ZS"
	};
       

        // Workplace location and allowed distance
        const WORKPLACE_LATITUDE = 1.6366114;
        const WORKPLACE_LONGITUDE = 103.1118949;
        const MAX_DISTANCE_METERS = 500; // Allow clocking in/out within 500 meters

        // DOM elements
        const authStatusEl = document.getElementById('auth-status');
        const userIdDisplayEl = document.getElementById('user-id-display');
        const clockInBtn = document.getElementById('clock-in-btn');
        const clockOutBtn = document.getElementById('clock-out-btn');
        const statusMessageEl = document.getElementById('status-message');
        const timesheetBody = document.getElementById('timesheet-body');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalCloseBtn = document.getElementById('modal-close');

        // Firebase initialization
        let app, db, auth, userId;

        // Custom Modal for alerts
        function showModal(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modal.classList.remove('hidden');
        }

        modalCloseBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        // Haversine formula to calculate distance between two points on Earth
        function getDistance(lat1, lon1, lat2, lon2) {
            const toRad = (x) => x * Math.PI / 180;
            const R = 6371e3; // Earth radius in meters
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // Geolocation and button state update
        function updateLocationAndButtons() {
            statusMessageEl.textContent = 'Checking your location...';
            clockInBtn.disabled = true;
            clockOutBtn.disabled = true;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const distance = getDistance(
                            position.coords.latitude,
                            position.coords.longitude,
                            WORKPLACE_LATITUDE,
                            WORKPLACE_LONGITUDE
                        );

                        if (distance <= MAX_DISTANCE_METERS) {
                            statusMessageEl.textContent = `You are ${distance.toFixed(2)} meters from the workplace. You can clock in/out.`;
                            clockInBtn.disabled = false;
                            clockOutBtn.disabled = false;
                        } else {
                            statusMessageEl.textContent = `You are ${distance.toFixed(2)} meters from the workplace. Too far to clock in/out.`;
                            clockInBtn.disabled = true;
                            clockOutBtn.disabled = true;
                        }
                    },
                    (error) => {
                        console.error("Geolocation error:", error);
                        statusMessageEl.textContent = 'Cannot get location. Please enable location services.';
                        showModal('Location Error', 'Unable to get your current location. Please ensure location services are enabled for this page.');
                        clockInBtn.disabled = true;
                        clockOutBtn.disabled = true;
                    }
                );
            } else {
                statusMessageEl.textContent = 'Geolocation is not supported by your browser.';
                showModal('Browser Error', 'Geolocation is not supported by this browser. Cannot verify your location.');
            }
        }

        async function initFirebase() {
            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                if (initialAuthToken) {
                    await signInWithCustomToken(auth, initialAuthToken);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        authStatusEl.textContent = 'Authenticated successfully!';
                        userIdDisplayEl.textContent = `User ID: ${userId}`;
                        updateLocationAndButtons();
                        setupTimesheetListener();
                    } else {
                        authStatusEl.textContent = 'Not authenticated.';
                        userIdDisplayEl.textContent = '';
                        clockInBtn.disabled = true;
                        clockOutBtn.disabled = true;
                    }
                });

            } catch (error) {
                console.error("Firebase initialization failed:", error);
                authStatusEl.textContent = 'Firebase connection failed.';
                showModal('Connection Error', 'Could not connect to the database. Please try again later.');
            }
        }

        // Listen for real-time timesheet data
        function setupTimesheetListener() {
            if (!db) { return; }

            const timesheetsRef = collection(db, `/artifacts/${appId}/public/data/timesheets`);
            onSnapshot(timesheetsRef, (snapshot) => {
                const timesheetData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderTimesheet(timesheetData);
            }, (error) => {
                console.error("Failed to fetch timesheet data:", error);
                showModal('Data Error', 'Failed to load timesheet data. Please check your connection.');
            });
        }

        function renderTimesheet(data) {
            if (!timesheetBody) return;
            timesheetBody.innerHTML = '';
            if (data.length === 0) {
                timesheetBody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-gray-500">No timesheet entries yet.</td></tr>`;
                return;
            }

            // Sort data by clock in time descending to show most recent first
            data.sort((a, b) => b.clockInTime - a.clockInTime);

            data.forEach(entry => {
                const row = document.createElement('tr');
                row.className = 'border-b border-gray-200 hover:bg-gray-100 transition-colors';
                const clockIn = entry.clockInTime ? new Date(entry.clockInTime).toLocaleString() : 'N/A';
                const clockOut = entry.clockOutTime ? new Date(entry.clockOutTime).toLocaleString() : 'N/A';

                row.innerHTML = `
                    <td class="py-3 px-6 whitespace-nowrap">${entry.userId.slice(0, 8)}...</td>
                    <td class="py-3 px-6">${clockIn}</td>
                    <td class="py-3 px-6">${clockOut}</td>
                    <td class="py-3 px-6">
                        <span class="p-2 text-xs font-semibold rounded-full
                            ${entry.status === 'clocked-in' ? 'bg-green-200 text-green-800' : 'bg-gray-200 text-gray-800'}">
                            ${entry.status}
                        </span>
                    </td>
                `;
                timesheetBody.appendChild(row);
            });
        }

        // Clock In functionality
        async function clockIn() {
            statusMessageEl.textContent = 'Clocking in...';
            clockInBtn.disabled = true;
            clockOutBtn.disabled = true;
            
            navigator.geolocation.getCurrentPosition(async (position) => {
                const now = Date.now();
                const userLocation = { latitude: position.coords.latitude, longitude: position.coords.longitude };
                
                try {
                    // Check if the user is already clocked in
                    const userTimesheetsRef = collection(db, `/artifacts/${appId}/public/data/timesheets`);
                    const q = query(userTimesheetsRef, where("userId", "==", userId), where("status", "==", "clocked-in"));
                    const snapshot = await getDocs(q);
                    
                    if (!snapshot.empty) {
                        showModal('Error', 'You are already clocked in.');
                        updateLocationAndButtons();
                        return;
                    }

                    await addDoc(userTimesheetsRef, {
                        userId: userId,
                        clockInTime: now,
                        clockInLocation: userLocation,
                        status: 'clocked-in',
                    });
                    
                    showModal('Success!', 'You have successfully clocked in.');
                    updateLocationAndButtons();
                } catch (e) {
                    console.error("Error clocking in:", e);
                    showModal('Error', 'Failed to clock in. Please try again.');
                    updateLocationAndButtons();
                }
            }, (error) => {
                console.error("Geolocation error:", error);
                showModal('Location Error', 'Unable to get location for clock in.');
                updateLocationAndButtons();
            });
        }

        // Clock Out functionality
        async function clockOut() {
            statusMessageEl.textContent = 'Clocking out...';
            clockInBtn.disabled = true;
            clockOutBtn.disabled = true;

            navigator.geolocation.getCurrentPosition(async (position) => {
                const now = Date.now();
                const userLocation = { latitude: position.coords.latitude, longitude: position.coords.longitude };
                
                try {
                    // Find the most recent "clocked-in" entry for the current user
                    const timesheetsRef = collection(db, `/artifacts/${appId}/public/data/timesheets`);
                    const q = query(timesheetsRef, where("userId", "==", userId), where("status", "==", "clocked-in"));
                    const snapshot = await getDocs(q);

                    if (snapshot.empty) {
                        showModal('Error', 'You are not clocked in.');
                        updateLocationAndButtons();
                        return;
                    }
                    
                    const latestEntryDoc = snapshot.docs[0];
                    const docRef = doc(db, `/artifacts/${appId}/public/data/timesheets`, latestEntryDoc.id);
                    
                    await updateDoc(docRef, {
                        clockOutTime: now,
                        clockOutLocation: userLocation,
                        status: 'clocked-out',
                    });

                    showModal('Success!', 'You have successfully clocked out.');
                    updateLocationAndButtons();
                } catch (e) {
                    console.error("Error clocking out:", e);
                    showModal('Error', 'Failed to clock out. Please try again.');
                    updateLocationAndButtons();
                }
            }, (error) => {
                console.error("Geolocation error:", error);
                showModal('Location Error', 'Unable to get location for clock out.');
                updateLocationAndButtons();
            });
        }
        
        // Event listeners
        clockInBtn.addEventListener('click', clockIn);
        clockOutBtn.addEventListener('click', clockOut);
        
        // Start the application
        initFirebase();
    </script>
</body>
</html>
